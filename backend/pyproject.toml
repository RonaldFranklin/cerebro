[project]
name = "cerebro"
version = "0.0.0"
description = "Self-hosted, single-user knowledge base that gives AI agents curated context through MCP."
license = "Apache-2.0"
requires-python = "==3.14.*"
dependencies = [
    "cryptography==50.0.2",
    "mcp==2.3.0",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[project.scripts]
cerebro = "cerebro.bootstrap.cli:main"

[dependency-groups]
dev = [
    "import-linter==2.16",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "types-pyyaml==6.0.12.20261113",
]

[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.9"
# Supply-chain rule (ADR-0013): only resolve packages uploaded at least 7 days ago.
exclude-newer = "7 days"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

[tool.coverage.run]
source_pkgs = ["cerebro.domain", "cerebro.application"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "^\\s*\\.\\.\\.\\s*$"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests", "devtools"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "C4",      # comprehensions
    "SIM",     # simplify
    "PT",      # pytest style
    "RUF",     # ruff-specific
]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "devtools"]
mypy_path = "src"
warn_unreachable = true

[tool.importlinter]
root_package = "cerebro"
include_external_packages = true
contract_types = ["stdlib_only: devtools.import_contracts.StdlibOnlyContract"]

[[tool.importlinter.contracts]]
name = "Layers point inward: bootstrap -> adapters -> application -> domain"
type = "layers"
layers = [
    "cerebro.bootstrap",
    "cerebro.adapters",
    "cerebro.application",
    "cerebro.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application use only the standard library"
type = "stdlib_only"
source_modules = ["cerebro.domain", "cerebro.application"]

[[tool.importlinter.contracts]]
name = "Inbound adapters use use cases and DTOs only, never ports or outbound adapters"
type = "forbidden"
source_modules = ["cerebro.adapters.inbound"]
forbidden_modules = ["cerebro.application.ports", "cerebro.adapters.outbound"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Inbound adapters never import the composition root"
type = "forbidden"
source_modules = ["cerebro.adapters.inbound"]
forbidden_modules = ["cerebro.bootstrap"]

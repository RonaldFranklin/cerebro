name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and dependencies (lockfile must be up to date)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Import contracts
        run: uv run lint-imports --no-cache

      - name: Tests with coverage gate (domain + application >= 90%)
        run: uv run pytest --cov

  web:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified Node and pnpm
        run: |
          version=$(cat .nvmrc)
          archive="node-v${version}-linux-x64.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSLO --retry 3 "https://nodejs.org/dist/v${version}/$archive"
          echo "5c063e46bab0fbc1c17cc445d7ff129cbdcd0471be6ed83b6ab864f8143bc864  $archive" | sha256sum -c -
          tar -xJf "$archive"
          node_bin="$RUNNER_TEMP/node-v${version}-linux-x64/bin"
          export PATH="$node_bin:$PATH"
          npm install --prefix "$RUNNER_TEMP/pnpm" --before=2026-11-19T00:00:00Z --no-audit --no-fund pnpm@12.22.0
          echo "$node_bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build and launch the browser fixture
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium
          pnpm run test:toolchain

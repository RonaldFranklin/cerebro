name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and dependencies (lockfile must be up to date)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Import contracts
        run: uv run lint-imports --no-cache

      - name: Tests with coverage gate (domain + application >= 90%)
        run: uv run pytest --cov

  web:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified Node and pnpm
        run: |
          version=$(cat .nvmrc)
          archive="node-v${version}-linux-x64.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSLO --retry 3 "https://nodejs.org/dist/v${version}/$archive"
          echo "5c063e46bab0fbc1c17cc445d7ff129cbdcd0471be6ed83b6ab864f8143bc864  $archive" | sha256sum -c -
          tar -xJf "$archive"
          node_bin="$RUNNER_TEMP/node-v${version}-linux-x64/bin"
          curl -fsSLo pnpm.tgz --retry 3 "https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.22.0.tgz"
          echo "881019018098a28c3a83468e6ca9a9aca9080463bbda62b82857ea22b63b8c874746401b37aeed70dd3381a3c4dfd50011d31cae42e12f012697e54cc5ff21f1  pnpm.tgz" | sha512sum -c -
          mkdir "$RUNNER_TEMP/pnpm"
          tar -xzf pnpm.tgz --strip-components=1 -C "$RUNNER_TEMP/pnpm" package/pnpm
          echo "$node_bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - name: Install web dependencies and Chromium
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Build and test the production browser application
        run: |
          (cd backend && uv sync --locked)
          cd web
          pnpm run typecheck
          pnpm run build
          pnpm run test:component
          pnpm run test:e2e
